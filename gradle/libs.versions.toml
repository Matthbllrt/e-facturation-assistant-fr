[versions]
agp = "8.11.1"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.2"
coreKtx = "1.16.0"
lifecycle = "2.9.2"
activityCompose = "1.10.1"
composeBom = "2025.06.01"
navigation = "2.9.3"
room = "2.7.2"
sqlcipher = "4.6.1"
sqlite = "2.5.2"
work = "2.10.2"
biometric = "1.1.0"
datastore = "1.1.7"
