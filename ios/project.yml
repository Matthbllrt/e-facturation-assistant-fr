# XcodeGen spec.
#
# The .xcodeproj is generated rather than committed: a hand-maintained pbxproj is a merge
# nightmare and impossible to review. Run `xcodegen generate` in this folder (see README).
name: RadarDeal
options:
  bundleIdPrefix: com.radardeal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RadarDealCore:
    path: RadarDealCore

targets:
  RadarDeal:
    type: application
    platform: iOS
    sources:
      - path: App/RadarDeal
    dependencies:
      - package: RadarDealCore
    info:
      path: App/RadarDeal/Info.plist
      properties:
        CFBundleDisplayName: RadarDeal
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Declared so iOS will hand us occasional background time. It is a courtesy, not a
        # guarantee — see README, "Ce qu'iOS autorise réellement".
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.radardeal.app.refresh
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.radardeal.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
